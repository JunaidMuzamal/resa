[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resa"
version = "1.0.0"
description = "ReSA: Recover-and-Verify Static Analysis for IaC security smell detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.2",
  "transformers>=4.45,<5",
  "tokenizers>=0.19",
  "sentencepiece>=0.2",
  "safetensors>=0.4",
  "accelerate>=0.33",
  "pandas>=2.0",
  "pyarrow>=14",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "requests>=2.31",
  "tqdm>=4.66",
  "matplotlib>=3.7",
  "psutil>=5.9",
  "setuptools<81",
  "click>=8",
  "alive-progress>=3",
  "prettytable>=3",
  "configparser>=5",
  "ruamel.yaml>=0.17",
  "ply>=3.11",
  "puppetparser>=0.2",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6"]
dev = ["pytest>=7"]

[project.scripts]
resa = "resa.cli:main"

[tool.setuptools.packages.find]
include = ["resa*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
